id: netmon_metric_if_mtu_effective_bytes_msg
label: Metric if_mtu_effective_bytes (msg)
category: 'Network/Metrics/physical'
flags: [python]
file_format: 1
documentation: 'MTU efetivo (detecção de inconsistências)'

parameters:
  - id: node
    label: Node
    dtype: string
    default: node
  - id: value
    label: Default value
    dtype: real
    default: 0.0
  - id: labels_json
    label: Labels JSON
    dtype: string
    default: '{}'
  - id: details_json
    label: Details JSON
    dtype: string
    default: '{}'

inputs:
  - domain: message
    id: tick
    label: tick

outputs:
  - domain: message
    id: metrics
    label: metrics

templates:
  imports: |
    from netmon.metric_emitter import MetricEmitterMsg
  make: |
    MetricEmitterMsg(metric_name='if_mtu_effective_bytes', layer='physical', unit='bytes', node=${node}, value=${value}, labels_json=${labels_json}, details_json=${details_json})

ports:
  msg_in:
    - tick
  msg_out:
    - metrics
