id: netmon_metric_vxlan_vni_mapping_ok_msg
label: Metric vxlan_vni_mapping_ok (msg)
category: 'Network/Metrics/network'
flags: [python]
file_format: 1
documentation: 'VNI/VRF mapping health'

parameters:
  - id: node
    label: Node
    dtype: string
    default: node
  - id: value
    label: Default value
    dtype: real
    default: 0.0
  - id: labels_json
    label: Labels JSON
    dtype: string
    default: '{}'
  - id: details_json
    label: Details JSON
    dtype: string
    default: '{}'

inputs:
  - domain: message
    id: tick
    label: tick

outputs:
  - domain: message
    id: metrics
    label: metrics

templates:
  imports: |
    from netmon.metric_emitter import MetricEmitterMsg
  make: |
    MetricEmitterMsg(metric_name='vxlan_vni_mapping_ok', layer='network', unit='bool', node=${node}, value=${value}, labels_json=${labels_json}, details_json=${details_json})

ports:
  msg_in:
    - tick
  msg_out:
    - metrics
