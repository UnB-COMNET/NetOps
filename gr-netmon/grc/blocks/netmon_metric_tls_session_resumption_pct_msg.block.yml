id: netmon_metric_tls_session_resumption_pct_msg
label: Metric tls_session_resumption_pct (msg)
category: 'Network/Metrics/session'
flags: [python]
file_format: 1
documentation: 'TLS session resumption rate'

parameters:
  - id: node
    label: Node
    dtype: string
    default: node
  - id: value
    label: Default value
    dtype: real
    default: 0.0
  - id: labels_json
    label: Labels JSON
    dtype: string
    default: '{}'
  - id: details_json
    label: Details JSON
    dtype: string
    default: '{}'

inputs:
  - domain: message
    id: tick
    label: tick

outputs:
  - domain: message
    id: metrics
    label: metrics

templates:
  imports: |
    from netmon.metric_emitter import MetricEmitterMsg
  make: |
    MetricEmitterMsg(metric_name='tls_session_resumption_pct', layer='session', unit='%', node=${node}, value=${value}, labels_json=${labels_json}, details_json=${details_json})

ports:
  msg_in:
    - tick
  msg_out:
    - metrics
