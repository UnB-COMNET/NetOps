id: netmon_metric_http2_negotiation_success_pct_msg
label: Metric http2_negotiation_success_pct (msg)
category: 'Network/Metrics/presentation'
flags: [python]
file_format: 1
documentation: 'HTTP/2 negotiation success'

parameters:
  - id: node
    label: Node
    dtype: string
    default: node
  - id: value
    label: Default value
    dtype: real
    default: 0.0
  - id: labels_json
    label: Labels JSON
    dtype: string
    default: '{}'
  - id: details_json
    label: Details JSON
    dtype: string
    default: '{}'

inputs:
  - domain: message
    id: tick
    label: tick

outputs:
  - domain: message
    id: metrics
    label: metrics

templates:
  imports: |
    from netmon.metric_emitter import MetricEmitterMsg
  make: |
    MetricEmitterMsg(metric_name='http2_negotiation_success_pct', layer='presentation', unit='%', node=${node}, value=${value}, labels_json=${labels_json}, details_json=${details_json})

ports:
  msg_in:
    - tick
  msg_out:
    - metrics
