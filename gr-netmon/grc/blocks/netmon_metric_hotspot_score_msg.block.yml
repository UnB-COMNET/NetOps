id: netmon_metric_hotspot_score_msg
label: Metric hotspot_score (msg)
category: 'Network/Metrics/service'
flags: [python]
file_format: 1
documentation: 'Hotspot score (links/ASICs com maior utilização/drops)'

parameters:
  - id: node
    label: Node
    dtype: string
    default: node
  - id: value
    label: Default value
    dtype: real
    default: 0.0
  - id: labels_json
    label: Labels JSON
    dtype: string
    default: '{}'
  - id: details_json
    label: Details JSON
    dtype: string
    default: '{}'

inputs:
  - domain: message
    id: tick
    label: tick

outputs:
  - domain: message
    id: metrics
    label: metrics

templates:
  imports: |
    from netmon.metric_emitter import MetricEmitterMsg
  make: |
    MetricEmitterMsg(metric_name='hotspot_score', layer='service', unit='', node=${node}, value=${value}, labels_json=${labels_json}, details_json=${details_json})

ports:
  msg_in:
    - tick
  msg_out:
    - metrics
